name: Go Full CI
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: go-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
    with:
      tier: full
