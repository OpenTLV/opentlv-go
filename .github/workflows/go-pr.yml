name: Go Pull Request CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
    with:
      tier: pr
